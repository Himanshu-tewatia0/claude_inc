[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfuse"
version = "0.2.0"
description = "Local pre-execution AI agent spend firewall and atomic token ledger"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Himanshu Tewatia", email = "himanshutewatia771@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
